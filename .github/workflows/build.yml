name: Build single-file binaries

on:
  push:
    branches: [ main, master ]
    tags:      [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: bios-windows-x64
            binary: dist/bios.exe
          - os: ubuntu-latest
            artifact: bios-linux-x64
            binary: dist/bios
          - os: macos-latest
            artifact: bios-macos
            binary: dist/bios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux SDL deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libsdl2-image-2.0-0 \
            libsdl2-mixer-2.0-0 libsdl2-ttf-2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame numpy pyinstaller

      - name: Run smoke test (headless)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python smoke_test.py

      - name: Build with PyInstaller
        run: pyinstaller bios.spec

      - name: Show output
        shell: bash
        run: ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Attach binaries to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries with OS suffix
        run: |
          mkdir -p release
          cp artifacts/bios-windows-x64/bios.exe release/bios-windows-x64.exe
          cp artifacts/bios-linux-x64/bios     release/bios-linux-x64
          cp artifacts/bios-macos/bios         release/bios-macos
          chmod +x release/bios-linux-x64 release/bios-macos
          ls -la release/

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/bios-windows-x64.exe
            release/bios-linux-x64
            release/bios-macos
          generate_release_notes: true
